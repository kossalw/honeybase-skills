type AiChatMutations {
  "Create an AI copilot chat on a process"
  createChat(processId: Long, "Chat subject kind: workflow | agent | home" subjectKind: String, subjectId: Long, name: String!, "ChatSettings json (mode, maxToolCalls, integrationId, model)" settings: String, "Which surface opened this chat: direct | fix_with_barry | home. Metrics only - gates nothing." origin: String): WorkflowChat
  "Send a user message and start the copilot's turn (streams via watchChat)"
  sendChatMessage(chatId: Long!, content: String!, "Workflow chats: the current canvas graph — becomes the chat's working graph" workflowData: WorkflowDataGqlInput, "Agent chats: the builder form's AgentDraftSnapshot JSON — becomes the chat's working draft" agentDraft: String, "App chats: the editor's AppDraftSnapshot JSON — a MANIFEST of the draft (identity, content digest, paths and sizes), never file contents. App files live in app_file and Barry writes them through AppService directly, so there is no working copy to carry" appSnapshot: String, "Home chats: the HomeSnapshot JSON (the organization the chat is scoped to)" homeContext: String, integrationId: Long!, model: String!, "Public ids of already-uploaded workflow files to attach to this message (pasted images). Ids only: the server rebuilds each reference from its own row, so a name, type or size claimed by the client is never believed. Capped per message and by total bytes; every attachment is replayed on each subsequent turn of the chat." files: [String!]!): Boolean
  "Stop the in-flight copilot turn"
  cancelChatTurn(chatId: Long!): Boolean
  "Approve or reject a pending tool call (AskPermission mode)"
  respondToToolCall(chatId: Long!, toolCallId: String!, approved: Boolean!, "Rejections only: an optional free-text reply the copilot sees verbatim (it may carry the content you actually want, e.g. a corrected form schema). Capped server-side." note: String, "Input-request cards only: an InputClaim JSON saying what the user created (e.g. {\"Integration\":{\"integrationId\":42}}). It is a POINTER, never a fact and never tool arguments — the server re-reads what it points at under your own permissions and builds the copilot's result from what it finds, so a forged or cross-organization id yields an 'unavailable' result rather than anything the model believes." inputClaim: String): Boolean
  "Revert an approved copilot write while it is still safe to: the newest revertible write of an idle chat, untouched since, with at most one message after it. Returns whether the revert happened; either way the chat gains a ToolCallUndone event saying what did or did not change. This is never a tool the copilot can call."
  undoToolCall(chatId: Long!, "The tool call to revert, named by the id on its ToolCallResult event. It is a POINTER and nothing more: the operation is rebuilt from the inverse the server persisted when the write happened, never from anything the client sends, and it runs through the same services under the same identity the write used. Only the newest still-revertible write of the chat qualifies, and only while it is untouched and the chat is idle." toolCallId: String!): Boolean
  "Update a chat's settings (mode, tool-call limit, model)"
  updateChatSettings(chatId: Long!, settings: String!): WorkflowChat
  "Rename a chat"
  renameChat(chatId: Long!, name: String!): WorkflowChat
  "Delete a chat and its transcript"
  deleteChat(chatId: Long!): Boolean
}

